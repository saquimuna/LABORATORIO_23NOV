<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AulaTech - Servicios técnicos</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>AulaTech</h1>
    <p>Soluciones para tus equipos</p>
  </header>
  <main>
    <section>
      <h2>Servicios disponibles</h2>
      <ul>
        <li>Mantenimiento preventivo</li>
        <li>Instalación de software</li>
        <li>Diagnóstico de equipos</li>
      </ul>
    </section>
  <section>
   <h2>Solicitar atención</h2>
   <form>
     <label for="cliente">Nombre del cliente</label>
     <input id="cliente" name="cliente" type="text" required>
     <label for="correo">Correo electrónico</label>
     <input id="correo" name="correo" type="email" required>
     <label for="servicio">Tipo de servicio</label>
     <select id="servicio" name="servicio">
       <option>Mantenimiento preventivo</option>
       <option>Instalación de software</option>
       <option>Diagnóstico de equipos</option>
     </select>
     <button type="submit">Enviar solicitud</button>
   </form>
 </section>


  </main>
  <footer><p>Portal educativo de servicios técnicos</p></footer>
</body>
</html>
